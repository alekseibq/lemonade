[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemonade-rl-lab"
version = "0.1.0"
description = "A reproducible Lemonade Stand reinforcement-learning laboratory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=0.29,<2",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.3,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<9", "hypothesis>=6,<7", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[project.scripts]
lemonade = "lemonade.cli:main"

[tool.setuptools.packages.find]
include = ["lemonade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

